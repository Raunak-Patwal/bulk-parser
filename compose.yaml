name: bulk-parser

services:

  # Go Application
  api:

    build:
      context: .
      dockerfile: Dockerfile

    image: bulk-parser:v1

    restart: unless-stopped

    expose:
      - "8081"

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8081/health

      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    stop_grace_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - backend


  # Nginx Reverse Proxy
  nginx:

    image: nginx:alpine

    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./deployments/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      api:
        condition: service_healthy

    networks:
      - frontend
      - backend

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


networks:

  frontend:
    driver: bridge

  backend:
    driver: bridge
    internal: true
