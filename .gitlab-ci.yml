stages:
    - build
    - test
    - push
    - deploy

build_job:
    stage: build
    script:
        - echo "this build is done using command docker build -t tag"
    tags:
       - dev

test_job:
    stage: test
    script:
        - echo "this is testing of our docker build"
        - mkdir -p logs
        - echo "these are my test results">logs/app.log
    artifacts:
        paths:
            - "logs/"
        expire_in: 30 days
    tags:
        - dev

push_job:
    stage: push
    script:
        - echo "this"
        - echo "is pushing to docker hub"
    tags:
        - dev

deploy_job:
    stage: deploy
    script:
        - echo "this"
        - echo "is deploying to EC2 instance for $DOCKERHUB_USER"
        - echo "this log is from $CI_JOB_STAGE>>logs/app.log"
    artifacts:
        paths:
            - "logs/"
    tags:
        - dev

dev_test_job: 
    stage: test
    script: 
        - echo "tested for devl"
    tags:
        - dev
    

prod_test_job: 
    stage: test
    script: 
        - echo "tested for prod"
    tags:
        - dev
